name: Convert to Audiobook

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      file:
        description: "Filename in input/ to convert"
        required: false
        default: ""

env:
  VOICE: en_GB-cori-high

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and rename input file
        id: find_file
        run: |
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILE="input/${{ github.event.inputs.file }}"
          else
            # Find any non-gitkeep file in input/
            FILE=$(find input/ -type f ! -name ".gitkeep" | head -1)
          fi
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "No input file found. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          cp "$FILE" /tmp/book.epub
          echo "file=/tmp/book.epub" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Install system dependencies
        if: steps.find_file.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc ffmpeg python3 python3-venv

      - name: Set up Python venv and install Piper
        if: steps.find_file.outputs.skip != 'true'
        run: |
          python3 -m venv /opt/book2audio-venv
          /opt/book2audio-venv/bin/pip install --upgrade pip
          /opt/book2audio-venv/bin/pip install piper-tts numpy

      - name: Download Piper voice
        if: steps.find_file.outputs.skip != 'true'
        run: |
          mkdir -p voices
          VOICE_NAME="${{ env.VOICE }}"
          LANG="${VOICE_NAME%%-*}"
          REST="${VOICE_NAME#*-}"
          REGION="${REST%%-*}"
          SPEAKER="${REST#*-}"
          QUALITY="high"
          if [[ "${SPEAKER}" == *-high ]]; then
            QUALITY="high"
            SPEAKER="${SPEAKER%-high}"
          elif [[ "${SPEAKER}" == *-medium ]]; then
            QUALITY="medium"
            SPEAKER="${SPEAKER%-medium}"
          elif [[ "${SPEAKER}" == *-low ]]; then
            QUALITY="low"
            SPEAKER="${SPEAKER%-low}"
          fi
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0"
          curl -sL -o "voices/${VOICE_NAME}.onnx" "${BASE}/${LANG}/${LANG}_${REGION}/${SPEAKER}/${QUALITY}/${VOICE_NAME}.onnx?download=true"
          curl -sL -o "voices/${VOICE_NAME}.onnx.json" "${BASE}/${LANG}/${LANG}_${REGION}/${SPEAKER}/${QUALITY}/${VOICE_NAME}.onnx.json?download=true"

      - name: Convert to audiobook
        if: steps.find_file.outputs.skip != 'true'
        run: |
          INPUT="${{ steps.find_file.outputs.file }}"
          OUTPUT_DIR="audiobook_output"
          mkdir -p "$OUTPUT_DIR"
          /opt/book2audio-venv/bin/python3 convert.py "$INPUT" "$OUTPUT_DIR" --voice "voices/${{ env.VOICE }}.onnx" --quiet

      - name: Upload audiobook artifacts
        if: steps.find_file.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audiobook
          path: audiobook_output/*.mp3
          retention-days: 3

      - name: Clean up
        if: always()
        run: |
          rm -f /tmp/book.epub
          rm -rf audiobook_output voices
